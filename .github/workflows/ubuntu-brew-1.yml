name: ubuntu-brew-1
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1
      - run: brew install cyan ipapatch
      - run: cyan --help
      - run: ipapatch --help
      - run: dpkg --help
