name: ubuntu-brew-1
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
      - run: brew install cyan ipapatch
      - run: cyan --help
      - run: ipapatch --help
      - run: dpkg --help
